[project]
name = "mmsim"
version = "0.1.0"
description = "Synthetic market-making simulator with Monte Carlo strategy analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
